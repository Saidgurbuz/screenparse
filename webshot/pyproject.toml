[project]
name = "webshot-dataset"
version = "0.1.0"
description = "Webshot dataset generation and evaluation toolkit for ScreenParse"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "docling-core>=2.74.1",
    "docling-ibm-models>=3.13.2",
    "imagehash>=4.3.2",
    "numpy>=2.3.4",
    "opencv-python-headless>=4.11.0.86",
    "orjson>=3.11.3",
    "pillow>=12.0.0",
    "playwright>=1.55.0",
    "pytesseract>=0.3.13",
    "python-levenshtein>=0.27.3",
    "python-slugify>=8.0.4",
    "tqdm>=4.67.1",
]

[tool.uv]
package = true

[project.scripts]
wsd = "webshot.cli:main"
wsd-eval = "evaluation.cli:main"
